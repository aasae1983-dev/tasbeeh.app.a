<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صدقة جارية - العدادات الحية</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase App & Database -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-cream: #FDFBF7;
      --bg-card: #F4EFE6;
      --bg-card-hover: #EBE4D5;
      --primary-green: #1B4D3E;
      --deep-green: #0F3328;
      --light-green: #2C6B56;
      --accent-gold: #C59B27;
      --gold-light: #E5C365;
      --gold-glow: rgba(197, 155, 39, 0.3);
      --text-main: #2A332E;
      --text-muted: #5C6B63;
      --border-color: #E2D9C8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(27, 77, 62, 0.05) 0%, transparent 70%),
        radial-gradient(circle at 50% 100%, rgba(197, 155, 39, 0.05) 0%, transparent 70%);
      padding: 20px 16px 40px 16px;
      overflow-x: hidden;
    }
        .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .header-card {
      width: 100%;
      background: linear-gradient(135deg, var(--deep-green) 0%, var(--primary-green) 100%);
      color: #FFF;
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(15, 51, 40, 0.15);
      border: 1px solid var(--accent-gold);
      position: relative;
      overflow: hidden;
    }

    .header-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at top right, rgba(229, 195, 101, 0.15), transparent 50%);
      pointer-events: none;
    }

    .header-title {
      font-family: 'Reem Kufi', sans-serif;
      font-size: 1.8rem;
      color: var(--gold-light);
      margin-bottom: 8px;
    }

    .header-subtitle {
      font-size: 0.95rem;
      color: #E0EADF;
      line-height: 1.6;
    }

    .dhikr-selector {
      width: 100%;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 4px;
      scrollbar-width: none;
    }

    .dhikr-tab {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      color: var(--text-main);
      transition: 0.2s;
    }

    .dhikr-tab.active {
      background: var(--primary-green);
      color: #FFF;
      border-color: var(--accent-gold);
    }

    .dhikr-display-card {
      width: 100%;
      background: var(--bg-card);
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 20px rgba(0,0,0,0.03);
    }

    .dhikr-text {
      font-family: 'Amiri', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-green);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .counters-wrapper {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .counter-box {
      flex: 1;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .counter-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary-green);
    }

    .counter-lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .tasbeeh-btn-wrapper {
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .tasbeeh-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary-green), var(--deep-green));
      border: 4px solid var(--accent-gold);
      color: var(--gold-light);
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 25px rgba(27, 77, 62, 0.3);
      transition: transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tasbeeh-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <div class="header-title">صدقة جارية</div>
      <div class="header-subtitle">هذا التطبيق صدقة جارية لروح من تحب<br>اضغط للذكر لتكون في ميزان حسناتك وميزان حسنات من تحب</div>
    </div>

    <div class="dhikr-selector" id="dhikrTabs"></div>

    <div class="dhikr-display-card">
      <div class="dhikr-text" id="dhikrText">أستغفر الله العظيم واتوب إليه</div>
      
      <div class="counters-wrapper">
        <div class="counter-box">
          <div class="counter-val" id="globalCounter">0</div>
          <div class="counter-lbl">العداد الإجمالي العام</div>
        </div>
        <div class="counter-box">
          <div class="counter-val" id="personalCounter">0</div>
          <div class="counter-lbl">تسبيحاتك اليوم</div>
        </div>
      </div>
    </div>

    <div class="tasbeeh-btn-wrapper">
      <button class="tasbeeh-btn" id="tasbeehBtn" onclick="doTasbeeh()">اضغط هنا</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://dhikr-global-counter-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const dhikrs = [
      { id: 'astaghfirullah', name: 'أستغفر الله العظيم واتوب إليه' },
      { id: 'subhanallah', name: 'سبحان الله وبحمده سبحان الله العظيم' },
      { id: 'alhamdulillah', name: 'الحمد لله رب العالمين' },
      { id: 'allahuakbar', name: 'الله أكبر' }
    ];

    let currentDhikrIndex = 0;
    let personalCounts = {};

    function initTabs() {
      const tabsContainer = document.getElementById('dhikrTabs');
      dhikrs.forEach((d, i) => {
        const btn = document.createElement('button');
        btn.className = `dhikr-tab ${i === 0 ? 'active' : ''}`;
        btn.innerText = d.name.split(' ')[0] + '...';
        btn.onclick = () => selectDhikr(i);
        tabsContainer.appendChild(btn);
      });
    }

    function selectDhikr(index) {
      currentDhikrIndex = index;
      document.querySelectorAll('.dhikr-tab').forEach((t, i) => {
        t.classList.toggle('active', i === index);
      });
      document.getElementById('dhikrText').innerText = dhikrs[index].name;
      listenToGlobalCounter(dhikrs[index].id);
      updatePersonalDisplay();
    }

    function listenToGlobalCounter(dhikrId) {
      db.ref('counters/' + dhikrId).on('value', (snapshot) => {
        const val = snapshot.val() || 0;
        document.getElementById('globalCounter').innerText = val.toLocaleString('ar-EG');
      });
    }

    function doTasbeeh() {
      const dhikrId = dhikrs[currentDhikrIndex].id;
      db.ref('counters/' + dhikrId).transaction((curr) => (curr || 0) + 1);
      
      personalCounts[dhikrId] = (personalCounts[dhikrId] || 0) + 1;
      updatePersonalDisplay();

      if (navigator.vibrate) navigator.vibrate(40);
    }

    function updatePersonalDisplay() {
      const dhikrId = dhikrs[currentDhikrIndex].id;
      const val = personalCounts[dhikrId] || 0;
      document.getElementById('personalCounter').innerText = val.toLocaleString('ar-EG');
    }

    window.onload = () => {
      initTabs();
      selectDhikr(0);
    };
  </script>
</body>
</html>
